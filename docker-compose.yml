version: "3.9"

services:
  research:
    build: .
    container_name: ${PROJECT_NAME}
    tty: true
    stdin_open: true
    volumes:
      - ./:/repo
      - ${HOME}/.codex:/root/.codex
      - ${GITHUB_SSH_KEY_PATH}:/root/.ssh/id_github_codex:ro
      - ${HOME}/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ./ssh_config.github_only:/root/.ssh/config:ro
      - ${HOME}/.gitconfig:/root/.gitconfig
